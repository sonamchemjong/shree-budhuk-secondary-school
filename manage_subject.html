<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Manage Subject - Shree Budhuk Secondary School</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="assets/css/style.css" rel="stylesheet" />
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="dashboard.html">Shree Budhuk Secondary School</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" 
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Logout</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="d-flex">
        <div class="sidebar p-3">
            <a href="dashboard.html">Dashboard</a>
            <a href="manage_teacher.html">Manage Teacher</a>
            <a href="manage_students.html">Manage Students</a>
            <a href="manage_attendance.html">Manage Attendance</a>
            <a href="manage_fee.html">Manage Fee</a>
            <a href="manage_role.html">Manage Role</a>
            <a href="manage_subject.html" class="active">Manage Subject</a>
            <a href="manage_class.html">Manage Class</a>
            <a href="manage_exam.html">Manage Exam</a>
            <a href="manage_report_card.html">Manage Report Card</a>
            <a href="manage_notification.html">Manage Notification</a>
        </div>
        <div class="content flex-grow-1">
            <h1>Manage Subject</h1>
            <button class="btn btn-primary mb-3" data-bs-toggle="modal" data-bs-target="#addSubjectModal">Add Subject</button>
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Subject Name</th>
                        <th>Description</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="subjectTableBody">
                    <!-- Subject rows will be added here dynamically -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Add Subject Modal -->
    <div class="modal fade" id="addSubjectModal" tabindex="-1" aria-labelledby="addSubjectModalLabel" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <form id="addSubjectForm">
            <div class="modal-header">
              <h5 class="modal-title" id="addSubjectModalLabel">Add Subject</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label for="subjectName" class="form-label">Subject Name</label>
                    <input type="text" class="form-control" id="subjectName" required />
                </div>
                <div class="mb-3">
                    <label for="subjectDescription" class="form-label">Description</label>
                    <textarea class="form-control" id="subjectDescription" rows="3" required></textarea>
                </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
              <button type="submit" class="btn btn-primary">Add Subject</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let subjects = [];

        function renderSubjects() {
            const tbody = document.getElementById('subjectTableBody');
            tbody.innerHTML = '';
            subjects.forEach((subject, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${index + 1}</td>
                    <td>${subject.name}</td>
                    <td>${subject.description}</td>
                    <td>
                        <button class="btn btn-sm btn-danger" onclick="deleteSubject(${index})">Delete</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function deleteSubject(index) {
            if (confirm('Are you sure you want to delete this subject?')) {
                subjects.splice(index, 1);
                renderSubjects();
            }
        }

        document.getElementById('addSubjectForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('subjectName').value.trim();
            const description = document.getElementById('subjectDescription').value.trim();

            subjects.push({ name, description });
            renderSubjects();

            this.reset();
            const modal = bootstrap.Modal.getInstance(document.getElementById('addSubjectModal'));
            modal.hide();
        });

        renderSubjects();
    </script>
</body>
</html>
