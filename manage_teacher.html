<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Manage Teacher - Shree Budhuk Secondary School</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="assets/css/style.css" rel="stylesheet" />
    <style>
        .teacher-photo {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="dashboard.html">Shree Budhuk Secondary School</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" 
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Logout</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="d-flex">
        <div class="sidebar p-3">
            <a href="dashboard.html">Dashboard</a>
            <a href="manage_teacher.html" class="active">Manage Teacher</a>
            <a href="manage_students.html">Manage Students</a>
            <a href="manage_attendance.html">Manage Attendance</a>
            <a href="manage_fee.html">Manage Fee</a>
            <a href="manage_role.html">Manage Role</a>
            <a href="manage_subject.html">Manage Subject</a>
            <a href="manage_class.html">Manage Class</a>
            <a href="manage_exam.html">Manage Exam</a>
            <a href="manage_report_card.html">Manage Report Card</a>
            <a href="manage_notification.html">Manage Notification</a>
        </div>
        <div class="content flex-grow-1">
            <h1>Manage Teacher</h1>
            <div class="mb-3 d-flex align-items-center gap-3">
                <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addTeacherModal">Add Teacher</button>
                <input type="file" id="excelUploader" accept=".xls,.xlsx,.csv" class="form-control w-auto" />
                <button class="btn btn-secondary" id="downloadDemoExcel">Download Teacher Excel Demo</button>
            </div>
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Photo</th>
                        <th>Full Name</th>
                        <th>Birth Date</th>
                        <th>Phone</th>
                        <th>Username</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="teacherTableBody">
                    <!-- Teacher rows will be added here dynamically -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Add Teacher Modal -->
    <div class="modal fade" id="addTeacherModal" tabindex="-1" aria-labelledby="addTeacherModalLabel" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <form id="addTeacherForm">
            <div class="modal-header">
              <h5 class="modal-title" id="addTeacherModalLabel">Add Teacher</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label for="teacherPhoto" class="form-label">Upload Photo</label>
                    <input type="file" class="form-control" id="teacherPhoto" accept="image/*" />
                </div>
                <div class="mb-3">
                    <label for="teacherFullName" class="form-label">Full Name</label>
                    <input type="text" class="form-control" id="teacherFullName" required />
                </div>
                <div class="mb-3">
                    <label for="teacherDOB" class="form-label">Birth Date</label>
                    <input type="date" class="form-control" id="teacherDOB" required />
                </div>
                <div class="mb-3">
                    <label for="teacherPhone" class="form-label">Phone Number</label>
                    <input type="tel" class="form-control" id="teacherPhone" required />
                </div>
                <div class="mb-3">
                    <label for="teacherUsername" class="form-label">Username</label>
                    <input type="text" class="form-control" id="teacherUsername" required />
                </div>
                <div class="mb-3">
                    <label for="teacherPassword" class="form-label">Password</label>
                    <input type="password" class="form-control" id="teacherPassword" required />
                </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
              <button type="submit" class="btn btn-primary">Add Teacher</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Sample data array for teachers
        let teachers = [];

        function renderTeachers() {
            const tbody = document.getElementById('teacherTableBody');
            tbody.innerHTML = '';
                teachers.forEach((teacher, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${index + 1}</td>
                    <td><img src="${teacher.photo ? teacher.photo : 'https://via.placeholder.com/50'}" alt="Photo" class="teacher-photo" /></td>
                    <td>${teacher.fullName}</td>
                    <td>${teacher.dob}</td>
                    <td>${teacher.phone}</td>
                    <td>${teacher.username}</td>
                    <td>
                        <button class="btn btn-sm btn-danger" onclick="deleteTeacher(${index})">Delete</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function deleteTeacher(index) {
            if (confirm('Are you sure you want to delete this teacher?')) {
                teachers.splice(index, 1);
                renderTeachers();
            }
        }

        document.getElementById('addTeacherForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const photoInput = document.getElementById('teacherPhoto');
            const fullName = document.getElementById('teacherFullName').value.trim();
            const dob = document.getElementById('teacherDOB').value;
            const phone = document.getElementById('teacherPhone').value.trim();
            const username = document.getElementById('teacherUsername').value.trim();
            const password = document.getElementById('teacherPassword').value;

            if (photoInput.files && photoInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const photo = event.target.result;
                    teachers.push({ photo, fullName, dob, phone, username, password });
                    renderTeachers();

                    // Reset form and close modal
                    document.getElementById('addTeacherForm').reset();
                    const modal = bootstrap.Modal.getInstance(document.getElementById('addTeacherModal'));
                    modal.hide();
                };
                reader.readAsDataURL(photoInput.files[0]);
            } else {
                // No photo uploaded, use empty string or placeholder
                const photo = '';
                teachers.push({ photo, fullName, dob, phone, username, password });
                renderTeachers();

                // Reset form and close modal
                this.reset();
                const modal = bootstrap.Modal.getInstance(document.getElementById('addTeacherModal'));
                modal.hide();
            }
        });

        // Download demo Excel file as CSV
        document.getElementById('downloadDemoExcel').addEventListener('click', function() {
            const csvContent = "data:text/csv;charset=utf-8," 
                + "Full Name,Birth Date,Phone,Photo URL,Username,Password\n"
                + "John Doe,1980-01-01,1234567890,https://via.placeholder.com/50,johndoe,pass123\n"
                + "Jane Smith,1985-05-15,0987654321,https://via.placeholder.com/50,janesmith,pass456\n";
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "teacher_demo.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });

        // Initial render
        renderTeachers();
    </script>
</body>
</html>
