<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Manage Notification - Shree Budhuk Secondary School</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="assets/css/style.css" rel="stylesheet" />
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="dashboard.html">Shree Budhuk Secondary School</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" 
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Logout</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="d-flex">
        <div class="sidebar p-3">
            <a href="dashboard.html">Dashboard</a>
            <a href="manage_teacher.html">Manage Teacher</a>
            <a href="manage_students.html">Manage Students</a>
            <a href="manage_attendance.html">Manage Attendance</a>
            <a href="manage_fee.html">Manage Fee</a>
            <a href="manage_role.html">Manage Role</a>
            <a href="manage_subject.html">Manage Subject</a>
            <a href="manage_class.html">Manage Class</a>
            <a href="manage_exam.html">Manage Exam</a>
            <a href="manage_report_card.html">Manage Report Card</a>
            <a href="manage_notification.html" class="active">Manage Notification</a>
        </div>
        <div class="content flex-grow-1">
            <h1>Manage Notification</h1>
            <button class="btn btn-primary mb-3" data-bs-toggle="modal" data-bs-target="#addNotificationModal">Add Notification</button>
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Title</th>
                        <th>Message</th>
                        <th>Date</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="notificationTableBody">
                    <!-- Notification rows will be added here dynamically -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Add Notification Modal -->
    <div class="modal fade" id="addNotificationModal" tabindex="-1" aria-labelledby="addNotificationModalLabel" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <form id="addNotificationForm">
            <div class="modal-header">
              <h5 class="modal-title" id="addNotificationModalLabel">Add Notification</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label for="notificationTitle" class="form-label">Title</label>
                    <input type="text" class="form-control" id="notificationTitle" required />
                </div>
                <div class="mb-3">
                    <label for="notificationMessage" class="form-label">Message</label>
                    <textarea class="form-control" id="notificationMessage" rows="3" required></textarea>
                </div>
                <div class="mb-3">
                    <label for="notificationDate" class="form-label">Date</label>
                    <input type="date" class="form-control" id="notificationDate" required />
                </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
              <button type="submit" class="btn btn-primary">Add Notification</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let notifications = [];

        function renderNotifications() {
            const tbody = document.getElementById('notificationTableBody');
            tbody.innerHTML = '';
            notifications.forEach((notification, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${index + 1}</td>
                    <td>${notification.title}</td>
                    <td>${notification.message}</td>
                    <td>${notification.date}</td>
                    <td>
                        <button class="btn btn-sm btn-danger" onclick="deleteNotification(${index})">Delete</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function deleteNotification(index) {
            if (confirm('Are you sure you want to delete this notification?')) {
                notifications.splice(index, 1);
                renderNotifications();
            }
        }

        document.getElementById('addNotificationForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const title = document.getElementById('notificationTitle').value.trim();
            const message = document.getElementById('notificationMessage').value.trim();
            const date = document.getElementById('notificationDate').value;

            notifications.push({ title, message, date });
            renderNotifications();

            this.reset();
            const modal = bootstrap.Modal.getInstance(document.getElementById('addNotificationModal'));
            modal.hide();
        });

        renderNotifications();
    </script>
</body>
</html>
