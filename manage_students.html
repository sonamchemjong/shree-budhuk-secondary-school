<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Manage Students - Shree Budhuk Secondary School</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="assets/css/style.css" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="dashboard.html">Shree Budhuk Secondary School</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" 
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Logout</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="d-flex">
        <div class="sidebar p-3">
            <a href="dashboard.html">Dashboard</a>
            <a href="manage_teacher.html">Manage Teacher</a>
            <a href="manage_students.html" class="active">Manage Students</a>
            <a href="manage_attendance.html">Manage Attendance</a>
            <a href="manage_fee.html">Manage Fee</a>
            <a href="manage_role.html">Manage Role</a>
            <a href="manage_subject.html">Manage Subject</a>
            <a href="manage_class.html">Manage Class</a>
            <a href="manage_exam.html">Manage Exam</a>
            <a href="manage_report_card.html">Manage Report Card</a>
            <a href="manage_notification.html">Manage Notification</a>
        </div>
        <div class="content flex-grow-1">
            <h1>Manage Students</h1>
            <div class="mb-3 d-flex align-items-center gap-3">
                <div>
                    <label for="fileUpload" class="form-label">Upload Students Excel File</label>
                    <input class="form-control" type="file" id="fileUpload" accept=".xlsx, .xls" />
                </div>
<div>
    <button class="btn btn-outline-primary mt-4" id="excelDemoDownloadBtn">Excel Demo Download</button>
</div>
            </div>
            <button class="btn btn-primary mb-3" data-bs-toggle="modal" data-bs-target="#addStudentModal">Add Student</button>
            <div class="mb-3 d-flex align-items-center gap-2">
                <select id="searchCriteria" class="form-select" style="width: 150px;">
                    <option value="name">Name</option>
                    <option value="class">Class</option>
                    <option value="roll">Roll No</option>
                    <option value="phone">Phone</option>
                    <option value="username">Username</option>
                </select>
                <input type="text" id="searchInput" class="form-control" placeholder="Search students..." />
            </div>
            <table class="table table-striped">
<thead>
    <tr>
        <th><input type="checkbox" id="selectAll" /></th>
        <th>Photo</th>
        <th>Name</th>
        <th>Class</th>
        <th>Roll No</th>
        <th>Email</th>
        <th>Phone</th>
        <th>Username</th>
        <th>Actions</th>
    </tr>
</thead>
                <tbody id="studentTableBody">
                    <!-- Student rows will be added here dynamically -->
                </tbody>
            </table>
            <nav>
                <ul class="pagination" id="paginationControls"></ul>
            </nav>
        </div>
    </div>

    <!-- Add Student Modal -->
    <div class="modal fade" id="addStudentModal" tabindex="-1" aria-labelledby="addStudentModalLabel" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <form id="addStudentForm">
            <div class="modal-header">
              <h5 class="modal-title" id="addStudentModalLabel">Add Student</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label for="studentPhoto" class="form-label">Photo</label>
                    <input type="file" class="form-control" id="studentPhoto" accept="image/*" />
                    <img id="photoPreview" src="" alt="Photo Preview" class="img-thumbnail mt-2" style="max-width: 150px; display: none;" />
                </div>
                <div class="mb-3">
                    <label for="studentName" class="form-label">Student Name</label>
                    <input type="text" class="form-control" id="studentName" required />
                </div>
                <div class="mb-3">
                    <label for="fatherName" class="form-label">Father Name</label>
                    <input type="text" class="form-control" id="fatherName" required />
                </div>
                <div class="mb-3">
                    <label for="motherName" class="form-label">Mother Name</label>
                    <input type="text" class="form-control" id="motherName" required />
                </div>
                <div class="mb-3">
                    <label for="dob" class="form-label">Date of Birth (Nepali Date)</label>
                    <input type="text" class="form-control" id="dob" required />
                </div>
                <div class="mb-3">
                    <label for="studentClass" class="form-label">Class</label>
                    <input type="text" class="form-control" id="studentClass" required />
                </div>
                <div class="mb-3">
                    <label for="studentRoll" class="form-label">Roll No</label>
                    <input type="text" class="form-control" id="studentRoll" required />
                </div>
                <div class="mb-3">
                    <label for="address" class="form-label">Address</label>
                    <textarea class="form-control" id="address" rows="2" required></textarea>
                </div>
                <div class="mb-3">
                    <label for="academicYear" class="form-label">Academic Year (Nepali Year)</label>
                    <input type="text" class="form-control" id="academicYear" placeholder="e.g. 2079-2080" required />
                </div>
                <div class="mb-3">
                    <label for="studentPhone" class="form-label">Phone Number</label>
                    <input type="tel" class="form-control" id="studentPhone" required />
                </div>
                <div class="mb-3">
                    <label for="studentUsername" class="form-label">Username</label>
                    <input type="text" class="form-control" id="studentUsername" required />
                </div>
                <div class="mb-3">
                    <label for="studentPassword" class="form-label">Password</label>
                    <input type="password" class="form-control" id="studentPassword" required />
                </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
              <button type="submit" class="btn btn-primary">Add Student</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script>
        let students = [];
        let editingIndex = -1;
        let filteredStudents = [];
        let currentPage = 1;
        const studentsPerPage = 10;

        function renderStudents() {
            const tbody = document.getElementById('studentTableBody');
            tbody.innerHTML = '';
            const listToRender = filteredStudents.length > 0 ? filteredStudents : students;
            const startIndex = (currentPage - 1) * studentsPerPage;
            const endIndex = startIndex + studentsPerPage;
            const pageStudents = listToRender.slice(startIndex, endIndex);

            pageStudents.forEach((student, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><input type="checkbox" class="rowCheckbox" /></td>
                    <td><img src="${student.photo || 'https://via.placeholder.com/50'}" alt="Photo" style="max-width: 50px; max-height: 50px;" /></td>
                    <td>${student.name}</td>
                    <td>${student.class}</td>
                    <td>${student.roll}</td>
                    <td>${student.email}</td>
                    <td>${student.phone}</td>
                    <td>${student.username || ''}</td>
                    <td>
                        <button class="btn btn-sm btn-primary me-2" onclick="editStudent(${startIndex + index})">Edit</button>
                        <button class="btn btn-sm btn-danger" onclick="deleteStudent(${startIndex + index})">Delete</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
            renderPaginationControls(listToRender.length);
        }

        function renderPaginationControls(totalStudents) {
            const paginationControls = document.getElementById('paginationControls');
            paginationControls.innerHTML = '';
            const totalPages = Math.ceil(totalStudents / studentsPerPage);

            for (let i = 1; i <= totalPages; i++) {
                const li = document.createElement('li');
                li.className = 'page-item' + (i === currentPage ? ' active' : '');
                const a = document.createElement('a');
                a.className = 'page-link';
                a.href = '#';
                a.textContent = i;
                a.addEventListener('click', function(e) {
                    e.preventDefault();
                    currentPage = i;
                    renderStudents();
                });
                li.appendChild(a);
                paginationControls.appendChild(li);
            }
        }

        function editStudent(index) {
            editingIndex = index;
            const student = students[index];
            document.getElementById('studentName').value = student.name;
            document.getElementById('fatherName').value = student.fatherName;
            document.getElementById('motherName').value = student.motherName;
            document.getElementById('dob').value = student.dob;
            document.getElementById('address').value = student.address;
            document.getElementById('academicYear').value = student.academicYear;
            document.getElementById('studentClass').value = student.class;
            document.getElementById('studentRoll').value = student.roll;
            document.getElementById('studentPhone').value = student.phone;
            document.getElementById('studentUsername').value = student.username || '';
            document.getElementById('photoPreview').src = student.photo || '';
            if (student.photo) {
                document.getElementById('photoPreview').style.display = 'block';
            } else {
                document.getElementById('photoPreview').style.display = 'none';
            }
            const modal = new bootstrap.Modal(document.getElementById('addStudentModal'));
            modal.show();
        }

        function deleteStudent(index) {
            if (confirm('Are you sure you want to delete this student?')) {
                students.splice(index, 1);
                localStorage.setItem('students', JSON.stringify(students));
                renderStudents();
            }
        }

        document.getElementById('addStudentForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const photoInput = document.getElementById('studentPhoto');
            const photoFile = photoInput.files[0];
            let photoDataUrl = '';

            // Validation for required fields including photo
            const name = document.getElementById('studentName').value.trim();
            const fatherName = document.getElementById('fatherName').value.trim();
            const motherName = document.getElementById('motherName').value.trim();
            const dob = document.getElementById('dob').value.trim();
            const studentClass = document.getElementById('studentClass').value.trim();
            const roll = document.getElementById('studentRoll').value.trim();
            const address = document.getElementById('address').value.trim();
            const phone = document.getElementById('studentPhone').value.trim();
            const username = document.getElementById('studentUsername').value.trim();
            const password = document.getElementById('studentPassword').value;

            if (!photoFile) {
                alert('Please upload a photo.');
                return;
            }
            if (!name || !fatherName || !motherName || !dob || !studentClass || !roll || !address || !phone || !username || !password) {
                alert('Please fill in all required fields.');
                return;
            }

            if (photoFile) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    photoDataUrl = e.target.result;
                    saveStudent(photoDataUrl);
                };
                reader.readAsDataURL(photoFile);
            } else {
                saveStudent('');
            }

            function saveStudent(photoDataUrl) {
                const academicYear = document.getElementById('academicYear').value.trim();

                if (editingIndex === -1) {
                    students.push({ photo: photoDataUrl, name, fatherName, motherName, dob, address, academicYear, class: studentClass, roll, phone, username, password });
                } else {
                    students[editingIndex] = { photo: photoDataUrl, name, fatherName, motherName, dob, address, academicYear, class: studentClass, roll, phone, username, password };
                    editingIndex = -1;
                }
                localStorage.setItem('students', JSON.stringify(students));
                renderStudents();

                document.getElementById('addStudentForm').reset();
                document.getElementById('photoPreview').style.display = 'none';
                const modal = bootstrap.Modal.getInstance(document.getElementById('addStudentModal'));
                modal.hide();
            }
        });

        document.getElementById('fileUpload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const firstSheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheetName];
                const jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

                // Assuming first row is header
                const headers = jsonData[0];
                const rows = jsonData.slice(1);

                rows.forEach(row => {
                    let student = {};
                    headers.forEach((header, index) => {
                        const key = header.toString().toLowerCase().replace(/\s+/g, '');
                        student[key] = row[index] || '';
                    });
                    students.push({
                        photo: '', // No photo from excel upload
                        name: student.name || '',
                        fatherName: student.fathername || '',
                        motherName: student.mothername || '',
                        dob: student['dateofbirth(nepali)'] || student.dob || '',
                        address: student.address || '',
                        academicYear: student['academicyear(nepali)'] || student.academicyear || '',
                        class: student.class || '',
                        roll: student.rollno || student.roll || '',
                        email: student.email || '',
                        phone: student.phone || '',
                        username: student.username || '',
                        password: student.password || ''
                    });
                });
                filteredStudents = [];
                renderStudents();
            };
            reader.readAsArrayBuffer(file);
        });
        
        document.getElementById('excelDemoDownloadBtn').addEventListener('click', function() {
            const wb = XLSX.utils.book_new();
            const ws_data = [
                ['Student Name', 'Father Name', 'Mother Name', 'Date of Birth (Nepali)', 'Address', 'Class', 'Roll No', 'Academic Year (Nepali)', 'Phone Number', 'Username', 'Password'],
                ['John Doe', 'Robert Doe', 'Jane Doe', '2079-01-01', '123 Main St', '10', '1', '2079-2080', '1234567890', 'johndoe', 'pass123']
            ];
            const ws = XLSX.utils.aoa_to_sheet(ws_data);
            XLSX.utils.book_append_sheet(wb, ws, 'StudentAddDemo');
            XLSX.writeFile(wb, 'student_add_demo_template.xlsx');
        });

        renderStudents();

        // Select all checkbox functionality
        document.getElementById('selectAll').addEventListener('change', function() {
            const checked = this.checked;
            document.querySelectorAll('.rowCheckbox').forEach(cb => {
                cb.checked = checked;
            });
        });

        // Search functionality
        document.getElementById('searchInput').addEventListener('input', function() {
            const criteria = document.getElementById('searchCriteria').value;
            const query = this.value.trim().toLowerCase();
            if (!query) {
                filteredStudents = [];
                currentPage = 1;
                renderStudents();
                return;
            }
            filteredStudents = students.filter(student => {
                const value = (student[criteria] || '').toString().toLowerCase();
                return value.includes(query);
            });
            currentPage = 1;
            renderStudents();
        });
    </script>

    <!-- Nepali Datepicker CSS and JS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/nepali-datepicker-reactjs@2.0.0/dist/index.css" />
    <script src="https://cdn.jsdelivr.net/npm/nepali-datepicker-reactjs@2.0.0/dist/index.min.js"></script>

    <script>
        // Initialize Nepali Datepicker for DOB input
        document.addEventListener('DOMContentLoaded', function () {
            if (typeof NepaliDatePicker !== 'undefined') {
                new NepaliDatePicker('#dob', {
                    ndpYear: true,
                    ndpMonth: true,
                    ndpYearCount: 100
                });
            }
        });
    </script>
</body>
</html>
